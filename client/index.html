<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10B981" />
    <meta name="description" content="Query Master: pick a SQL template, fill in a few values, copy the SQL." />

    <!-- Link previews (LinkedIn, WhatsApp, Slack, X). Replace YOUR-SITE-URL with your real Vercel URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Query Master" />
    <meta property="og:title" content="Query Master: every query, one source of truth" />
    <meta property="og:description" content="Pick a template, fill in a few values, copy the SQL." />
    <meta property="og:image" content="https://query-master-ap.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Query Master: every query, one source of truth" />
    <meta name="twitter:description" content="Pick a template, fill in a few values, copy the SQL." />
    <meta name="twitter:image" content="https://query-master-ap.vercel.app/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Query Master</title>
    <script>
      // Applied synchronously, before first paint, so a saved "light" preference doesn't
      // flash dark for a frame while React/ThemeProvider mount. Defaults to dark (the
      // TRD's stated default) when nothing is saved yet.
      (function () {
        var saved = localStorage.getItem("query-master-theme");
        var theme = saved === "light" ? "light" : "dark";
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body class="bg-surface text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
